{% extends "base.html" %}
{% block title %}Login — Life Tracker{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card">
        <h1 class="text-2xl font-bold text-center mb-6 gradient-header text-transparent bg-clip-text" style="background-image: linear-gradient(135deg, #6366f1, #8b5cf6); -webkit-background-clip: text;">Welcome Back</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type|default:'text' }}" name="{{ field.name }}"
                       id="{{ field.id_for_label }}" value="{{ field.value|default:'' }}"
                       class="w-full px-4 py-2 rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-2 focus:ring-indigo-500 outline-none"
                       {% if field.field.required %}required{% endif %}>
                {% if field.errors %}<p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary w-full">Login</button>
        </form>
        <p class="text-center mt-4 text-sm text-gray-500">
            No account? <a href="{% url 'accounts:register' %}" class="text-indigo-600 font-medium">Register</a>
        </p>
    </div>
</div>
{% endblock %}
